<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TravelBharat Admin | Management Portal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --dark: #000080; --primary: #FF9933; --sec: #138808; --light: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; display: flex; margin: 0; background: var(--light); height: 100vh; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--dark); color: white; padding: 25px; display: flex; flex-direction: column; }
        .sidebar h2 { color: var(--primary); font-size: 22px; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 10px; }
        
        .nav-item { color: rgba(255,255,255,0.8); text-decoration: none; padding: 12px; display: block; border-radius: 8px; transition: 0.3s; margin-bottom: 5px; }
        .nav-item:hover { background: rgba(255,255,255,0.1); color: white; }

        /* Main Area */
        .main { flex: 1; padding: 40px; overflow-y: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 30px; border: 1px solid #eee; }
        
        .tab-btn { padding: 12px 25px; border: none; cursor: pointer; background: #e0e0e0; border-radius: 8px; font-weight: bold; margin-right: 10px; transition: 0.3s; }
        .tab-btn.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(255,153,51,0.3); }
        
        input, textarea, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; outline: none; font-family: inherit; }
        input:focus { border-color: var(--primary); }

        .btn-save { background: var(--sec); color: white; border: none; padding: 15px; width: 100%; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; margin-top: 10px; }
        .btn-save:hover { filter: brightness(1.1); transform: translateY(-2px); }

        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { background: #f8f9fa; color: #555; font-weight: 600; text-transform: uppercase; font-size: 12px; letter-spacing: 1px; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #eee; }
        
        .hidden { display: none; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-state { background: #e8f0fe; color: #1a73e8; }
        .badge-dist { background: #fef7e0; color: #f9ab00; }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>TravelBharat Admin</h2>
        <a href="/" class="nav-item"><i class="fas fa-arrow-left"></i> Back to Website</a>
        <div style="margin-top: auto;">
            <p style="font-size: 11px; opacity: 0.5;">v2.0 Managed Portal</p>
        </div>
    </div>

    <div class="main">
        <div class="header">
            <h1>Content Management</h1>
            <div>
                <button class="tab-btn active" onclick="show('sForm', this)">Add State</button>
                <button class="tab-btn" onclick="show('dForm', this)">Add District</button>
            </div>
        </div>

        <div id="sForm" class="card">
            <h3><i class="fas fa-map-marked-alt"></i> Register New State</h3>
            <form id="stateForm" onsubmit="saveState(event)">
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <input type="text" id="sn" placeholder="State Name (e.g. Karnataka)" required>
                    <input type="text" id="sc" placeholder="Capital City" required>
                </div>
                <input type="text" id="si" placeholder="Banner Image URL (Unsplash Link)" required>
                <textarea id="sd" placeholder="Brief Description of the State..." rows="3"></textarea>
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
                    <select id="szone">
                        <option value="North">North India</option>
                        <option value="South">South India</option>
                        <option value="West">West India</option>
                        <option value="East">East India</option>
                        <option value="NE">North-East</option>
                    </select>
                    <select id="scat">
                        <option value="Heritage">Heritage</option>
                        <option value="Nature">Nature</option>
                        <option value="Religious">Religious</option>
                        <option value="Adventure">Adventure</option>
                    </select>
                </div>
                <button type="submit" class="btn-save">Publish State</button>
            </form>
        </div>

        <div id="dForm" class="card hidden">
            <h3><i class="fas fa-city"></i> Add District & Attraction</h3>
            <form id="distForm" onsubmit="saveDist(event)">
                <select id="ss" required><option value="">Select Parent State</option></select>
                <input type="text" id="dn" placeholder="District Name (e.g. Mysuru)" required>
                <textarea id="di" placeholder="Interesting facts about this district..." rows="2"></textarea>
                
                <hr style="margin: 20px 0; opacity: 0.2;">
                <p><b><i class="fas fa-star"></i> Featured Attraction Details:</b></p>
                
                <input type="text" id="pn" placeholder="Place Name (e.g. Mysore Palace)" required>
                <input type="text" id="pi" placeholder="Place Image URL" required>
                
                <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
                    <input type="text" id="pt" placeholder="Timings (e.g. 9 AM - 6 PM)">
                    <input type="text" id="pc" placeholder="Entry Cost (e.g. ₹50)">
                    <input type="text" id="pa" placeholder="Area (e.g. City Center)">
                    <input type="text" id="pb" placeholder="Best Time (e.g. Oct-Mar)">
                </div>
                
                <button type="submit" class="btn-save" style="background:var(--dark);">Save District Entry</button>
            </form>
        </div>

        <div class="card">
            <h3>Encyclopedia Content Index</h3>
            <table>
                <thead>
                    <tr>
                        <th>Content Name</th>
                        <th>Level</th>
                        <th>Parent</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

    <script>
        // SECURITY GUARD: Prevents direct URL access without coming from login
        if (document.referrer === "" || !document.referrer.includes("index.html")) {
            // Uncomment below for production security
            // alert("Security Check: Unauthorized access! Please login.");
            // window.location.href = "/";
        }

        function show(id, btn) {
            document.getElementById('sForm').classList.add('hidden');
            document.getElementById('dForm').classList.add('hidden');
            document.getElementById(id).classList.remove('hidden');
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        async function load() {
            const states = await (await fetch('/api/states')).json();
            document.getElementById('ss').innerHTML = '<option value="">Select Parent State</option>' + 
                states.map(s => `<option value="${s.id}">${s.name}</option>`).join('');
            
            let html = "";
            states.forEach(s => {
                html += `<tr>
                    <td><b>${s.name}</b></td>
                    <td><span class="badge badge-state">STATE</span></td>
                    <td>-</td>
                    <td><button onclick="del(${s.id})" style="color:#e74c3c; border:none; background:none; cursor:pointer;"><i class="fas fa-trash"></i> Delete</button></td>
                </tr>`;
                if(s.districts) s.districts.forEach(d => {
                    html += `<tr>
                        <td style="padding-left: 40px;">${d.districtName}</td>
                        <td><span class="badge badge-dist">DISTRICT</span></td>
                        <td>${s.name}</td>
                        <td>-</td>
                    </tr>`;
                });
            });
            document.getElementById('list').innerHTML = html;
        }

        async function saveState(e) {
            e.preventDefault();
            const body = { 
                name: document.getElementById('sn').value, 
                capital: document.getElementById('sc').value, 
                image: document.getElementById('si').value, 
                description: document.getElementById('sd').value,
                zone: document.getElementById('szone').value,
                category: document.getElementById('scat').value
            };
            await fetch('/api/states', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)});
            alert("State added successfully!");
            location.reload();
        }

        async function saveDist(e) {
            e.preventDefault();
            const body = { 
                stateId: document.getElementById('ss').value, 
                districtName: document.getElementById('dn').value, 
                info: document.getElementById('di').value, 
                places: [{ 
                    name: document.getElementById('pn').value, 
                    image: document.getElementById('pi').value, 
                    timings: document.getElementById('pt').value,
                    cost: document.getElementById('pc').value,
                    area: document.getElementById('pa').value,
                    bestTime: document.getElementById('pb').value,
                    history: "Content verified by admin." 
                }] 
            };
            await fetch('/api/districts', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body)});
            alert("District and Place saved!");
            location.reload();
        }

        async function del(id) { 
            if(confirm("Are you sure? This will remove the state and all its districts.")) { 
                await fetch(`/api/states/${id}`, {method:'DELETE'}); 
                load(); 
            } 
        }

        load();
    </script>
</body>
</html>
