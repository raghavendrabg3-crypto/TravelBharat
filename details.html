<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TravelBharat | Discovery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --primary: #FF9933; --dark: #000080; --light: #f4f7f6; --accent: #138808; }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden;
            background: #222; /* Fallback color */
        }
        
        /* --- FULL SCREEN BACKGROUND --- */
        .main { 
            flex: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            position: relative;
            background-size: cover;
            background-position: center;
            background-attachment: fixed; /* Parallax Effect */
            transition: background-image 0.8s ease-in-out;
        }

        /* Dark overlay to make text readable */
        .main::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5); 
            z-index: 0;
        }

        /* Sidebar Glass Effect */
        .sidebar { 
            width: 300px; 
            background: rgba(255, 255, 255, 0.9); 
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255,255,255,0.2); 
            display: flex; 
            flex-direction: column; 
            flex-shrink: 0; 
            z-index: 10;
        }
        
        .sidebar-head { padding: 25px; background: var(--dark); color: white; }
        
        .dist-link { padding: 18px 25px; cursor: pointer; border-bottom: 1px solid #eee; transition: 0.3s; font-size: 14px; color: #444; }
        .dist-link:hover { background: rgba(255, 153, 51, 0.1); }
        .dist-link.active { border-left: 5px solid var(--primary); background: #fff3e0; font-weight: bold; color: var(--dark); }
        
        /* Content Wrapper */
        .content-wrapper { position: relative; z-index: 1; color: white; }

        .hero-text { padding: 40px 40px 10px 40px; }
        .hero-text h1 { font-size: 42px; margin: 5px 0; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        .hero-text h2 { font-weight: normal; font-size: 16px; opacity: 0.8; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); gap: 25px; padding: 30px; }
        
        /* Glassmorphism Cards */
        .card { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(5px);
            border-radius: 15px; 
            overflow: hidden; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3); 
            border: 1px solid rgba(255,255,255,0.3); 
            display: flex; 
            flex-direction: column; 
            color: #333;
            transition: 0.3s;
        }
        .card:hover { transform: translateY(-10px); }
        .card img { width: 100%; height: 200px; object-fit: cover; }
        .card-content { padding: 20px; flex-grow: 1; }
        .card-content h3 { margin: 0 0 8px 0; color: var(--dark); font-size: 20px; }

        .quick-info-grid { 
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; 
            background: #fdfdfd; padding: 15px; border-top: 1px dashed #ddd;
        }
        .info-box { display: flex; align-items: center; gap: 8px; font-size: 11px; color: #444; }
        .info-box i { color: var(--primary); width: 14px; text-align: center; }
        .info-box b { color: var(--dark); text-transform: uppercase; font-size: 10px; display: block; }

        /* Action Buttons */
        .card-actions { display: flex; padding: 10px 15px; background: #fff; border-top: 1px solid #eee; gap: 10px; }
        .action-btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px; font-size: 12px; font-weight: 600;
            cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s;
        }
        .btn-map { background: var(--dark); color: white; }
        .btn-share { background: #f0f0f0; color: #333; }
        .btn-heart { background: #fff; border: 1px solid #ddd; color: #888; }
        .btn-heart.active { color: #ff4757; border-color: #ff4757; background: #fff5f6; }
        
        .empty-msg { padding: 100px; text-align: center; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-head">
            <a href="/" style="color:white; text-decoration:none; font-size: 13px;"><i class="fas fa-arrow-left"></i> Home</a>
            <h2 id="stName" style="margin: 10px 0 0 0; color: var(--primary);">Loading...</h2>
        </div>
        <div id="distList" style="overflow-y: auto;"></div>
    </div>

    <div class="main" id="mainBg">
        <div class="content-wrapper">
            <div class="hero-text">
                <h2 id="breadcrumb">State > Select District</h2>
                <h1 id="distTitle">Explore Destinations</h1>
                <p id="distDesc" style="max-width: 700px;"></p>
            </div>
            
            <div id="contentArea">
                <div class="grid" id="grid"></div>
            </div>
        </div>
    </div>

    <script>
        const stateId = new URLSearchParams(window.location.search).get('id');
        let stateData = null;

        async function init() {
            try {
                const response = await fetch('/api/states');
                const data = await response.json();
                stateData = data.find(s => s.id == stateId);

                if(stateData) {
                    document.getElementById('stName').innerText = stateData.name;
                    
                    // APPLY FULL SCREEN BACKGROUND
                    const mainBg = document.getElementById('mainBg');
                    mainBg.style.backgroundImage = `url('${stateData.image}')`;
                    
                    const list = document.getElementById('distList');
                    if (stateData.districts && stateData.districts.length > 0) {
                        list.innerHTML = stateData.districts.map((d, i) => `
                            <div class="dist-link" id="d-${i}" onclick="loadDist(${i}, this)">
                                <i class="fas fa-map-marker-alt" style="margin-right:8px; opacity:0.4;"></i>${d.districtName}
                            </div>
                        `).join('');
                        loadDist(0, document.getElementById('d-0'));
                    } else {
                        document.getElementById('contentArea').innerHTML = `
                            <div class="empty-msg">
                                <i class="fas fa-mountain fa-3x"></i>
                                <p>No data added for ${stateData.name} yet.</p>
                            </div>`;
                    }
                }
            } catch (err) {
                console.error("Database Error:", err);
            }
        }

        function loadDist(idx, el) {
            document.querySelectorAll('.dist-link').forEach(l => l.classList.remove('active'));
            el.classList.add('active');

            const d = stateData.districts[idx];
            document.getElementById('breadcrumb').innerText = `${stateData.name} \u203A ${d.districtName}`;
            document.getElementById('distTitle').innerText = `Visit ${d.districtName}`;
            document.getElementById('distDesc').innerText = d.info || "";

            const grid = document.getElementById('grid');
            if(d.places && d.places.length > 0) {
                grid.innerHTML = d.places.map(p => `
                    <div class="card">
                        <img src="${p.image}" onerror="this.src='https://placehold.co/600x400?text=${p.name}'">
                        <div class="card-content">
                            <h3>${p.name}</h3>
                            <p>${p.history || 'Discover the heritage of this destination.'}</p>
                        </div>
                        <div class="quick-info-grid">
                            <div class="info-box"><i class="fas fa-clock"></i><div><b>Timings</b>${p.timings || '9 AM - 6 PM'}</div></div>
                            <div class="info-box"><i class="fas fa-ticket-alt"></i><div><b>Entry Fee</b>${p.cost || 'Free'}</div></div>
                            <div class="info-box"><i class="fas fa-map-marker-alt"></i><div><b>Area</b>${p.area || 'Nearby'}</div></div>
                        </div>
                        <div class="card-actions">
                            <button class="action-btn btn-map" onclick="window.open('https://www.google.com/maps/search/${encodeURIComponent(p.name + " " + d.districtName)}')">
                                <i class="fas fa-directions"></i> Map
                            </button>
                            <button class="action-btn btn-share" onclick="alert('Shared to Clipboard!')">
                                <i class="fas fa-share-alt"></i> Share
                            </button>
                            <button class="action-btn btn-heart" onclick="this.classList.toggle('active')">
                                <i class="fas fa-heart"></i>
                            </button>
                        </div>
                    </div>
                `).join('');
            } else {
                grid.innerHTML = "<p style='color:white;'>No spots added for this district.</p>";
            }
        }
        init();
    </script>
</body>
</html>
